services:
  datasets_db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - datasets_db_data:/var/lib/postgresql/data
    networks:
      - court_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    env_file:
      - .env

  datasets_redis:
    image: redis:7.2
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - court_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    env_file:
      - .env

  datasets_app:
    build: .
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py makemigrations datasets &&
             python manage.py migrate datasets &&
             python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8003 court_datasets.wsgi:application"
    volumes:
      - ./logs:/app/logs
    depends_on:
      datasets_db:
        condition: service_healthy
      datasets_redis:
        condition: service_healthy
    networks:
      - court_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/datasets/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    env_file:
      - .env

  datasets_celery:
    build: .
    command: >
      sh -c "celery -A court_datasets.celery worker --loglevel=info"
    volumes:
      - ./logs:/app/logs
    depends_on:
      datasets_db:
        condition: service_healthy
      datasets_redis:
        condition: service_healthy
    networks:
      - court_network
    healthcheck:
      test: ["CMD", "celery", "-A", "court_datasets.celery", "inspect", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    env_file:
      - .env

volumes:
  datasets_db_data:

networks:
  court_network:
    external: true