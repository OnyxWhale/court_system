services:
  judges_db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - judges_db_data:/var/lib/postgresql/data
    networks:
      - court_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    env_file:
      - .env

  judges_app:
    build: .
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8002 court_judges.wsgi:application"
    volumes:
      - ./logs:/app/logs
    depends_on:
      judges_db:
        condition: service_healthy
    networks:
      - court_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/judges/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    env_file:
      - .env

volumes:
  judges_db_data:

networks:
  court_network:
    external: true