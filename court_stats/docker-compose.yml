services:
  stats_db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - stats_db_data:/var/lib/postgresql/data
    networks:
      - court_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  stats_redis:
    image: redis:7.2
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - court_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  stats_app:
    build: .
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8004 court_stats.wsgi:application"
    volumes:
      - ./logs:/app/logs
    depends_on:
      stats_db:
        condition: service_healthy
      stats_redis:
        condition: service_healthy
    networks:
      - court_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/stats/"]
      interval: 30s
      timeout: 5s
      retries: 3
    env_file:
      - .env

  stats_celery:
    build: .
    command: >
      sh -c "celery -A court_stats.celery worker --loglevel=info"
    volumes:
      - ./logs:/app/logs
    depends_on:
      stats_db:
        condition: service_healthy
      stats_redis:
        condition: service_healthy
    networks:
      - court_network
    healthcheck:
      test: ["CMD", "celery", "-A", "court_stats.celery", "inspect", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    env_file:
      - .env

volumes:
  stats_db_data:

networks:
  court_network:
    external: true