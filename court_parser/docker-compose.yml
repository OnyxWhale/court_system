services:
  parser_db:
    image: postgres:16
    environment:
      POSTGRES_DB: parser_db
      POSTGRES_USER: parser_user
      POSTGRES_PASSWORD: parser_password
    volumes:
      - parser_db_data:/var/lib/postgresql/data
    networks:
      - court_network

  parser_redis:
    image: redis:7.2
    networks:
      - court_network

  parser_app:
    build: .
    command: >
      sh -c "sleep 10 && 
             python manage.py makemigrations &&
             python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8001 court_parser.wsgi:application"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - parser_db
      - parser_redis
    networks:
      - court_network

  parser_celery:
    build: .
    command: >
      sh -c "sleep 10 && 
             celery -A court_parser.celery worker --loglevel=info"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - parser_db
      - parser_redis
    networks:
      - court_network

volumes:
  parser_db_data:

networks:
  court_network:
    external: true