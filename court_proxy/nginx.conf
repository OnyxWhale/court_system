server {
    listen 1408;
    server_name localhost;
    proxy_intercept_errors on;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;  # Уровень debug для диагностики

    resolver 127.0.0.11 valid=30s;

    set $parser_backend "http://parser_app:8001";
    set $judges_backend "http://judges_app:8002";
    set $datasets_backend "http://datasets_app:8003";
    set $stats_backend "http://stats_app:8004";
    set $admin_backend "http://admin_app:8005";

    location /static/ {
        alias /var/www/static/;  # Изменено на /var/www/static/, как в docker-compose
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        root /var/www/static;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /parser/ {
        proxy_pass $parser_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /judges/ {
        proxy_pass $judges_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /datasets/ {
        proxy_pass $datasets_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /stats/ {
        proxy_pass $stats_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        proxy_pass $admin_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /50x.html {
        root /var/www/static;
    }
}