worker_processes  1;
events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;

    # Разрешение имён через Docker DNS
    resolver 127.0.0.11 valid=30s;

    server {
        listen 1408;
        server_name localhost;

        # Переменные для бэкендов
        set $parser_backend "http://parser_app:8001";
        set $judges_backend "http://judges_app:8002";
        set $datasets_backend "http://datasets_app:8003";
        set $stats_backend "http://stats_app:8004";
        set $admin_backend "http://admin_app:8005";

        # Статические файлы
        location /static/ {
            root /app;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        # Главная страница
        location / {
            root /app/static;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Страница логина
        location = /login {
            root /app/static;
            try_files /login.html =404;
        }

        # Обработка аутентификации
        location = /auth {
            lua_need_request_body on;  # Включаем чтение тела запроса
            content_by_lua_block {
                -- Получаем данные из POST-запроса
                ngx.req.read_body()
                local args = ngx.req.get_post_args()
                local username = args["username"]
                local password = args["password"]
                local redirect = args["redirect"]

                -- Если redirect пустой, устанавливаем по умолчанию "/"
                if not redirect or redirect == "" then
                    redirect = "/"
                end

                -- Проверка логина и пароля (замените на свои значения)
                if username == "admin" and password == "password123" then
                    -- Установка cookie
                    ngx.header["Set-Cookie"] = "auth_token=authenticated; Path=/; Max-Age=3600"
                    -- Перенаправление на нужный путь
                    ngx.redirect(redirect)
                else
                    -- Ошибка: возврат на страницу логина с параметром error
                    ngx.redirect("/login?error=1&redirect=" .. ngx.escape_uri(redirect))
                end
            }
        }

        # Защита /parser/
        location /parser/ {
            access_by_lua_block {
                if not ngx.var.cookie_auth_token or ngx.var.cookie_auth_token ~= "authenticated" then
                    ngx.redirect("/login?redirect=" .. ngx.escape_uri(ngx.var.request_uri))
                end
            }
            proxy_pass $parser_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Защита /judges/
        location /judges/ {
            access_by_lua_block {
                if not ngx.var.cookie_auth_token or ngx.var.cookie_auth_token ~= "authenticated" then
                    ngx.redirect("/login?redirect=" .. ngx.escape_uri(ngx.var.request_uri))
                end
            }
            proxy_pass $judges_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Остальные маршруты
        location /datasets/ {
            proxy_pass $datasets_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /stats/ {
            proxy_pass $stats_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /admin/ {
            proxy_pass $admin_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Обработка ошибок
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /app/static;
            internal;
        }
    }
}