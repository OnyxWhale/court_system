<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Court System</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="header">
        <h1 class="header__title">Court System</h1>
    </header>
    <main class="container">
        <section class="section">
            <h1 class="section__title">Вход</h1>
            <form class="parser-form" method="POST" action="/auth">
                <div class="message-block">
                    <div class="form__group">
                        <label class="form__label" for="username">Имя пользователя</label>
                        <input class="form__input" type="text" id="username" name="username" required>
                    </div>
                    <div class="form__group">
                        <label class="form__label" for="password">Пароль</label>
                        <input class="form__input" type="password" id="password" name="password" required>
                    </div>
                </div>
                <input type="hidden" name="redirect" value="">
                <div class="form__buttons">
                    <button type="submit" class="button">Войти</button>
                    <a href="/" class="button button--secondary">Назад</a>
                </div>
            </form>
            <div class="status-box" id="error" style="display: none;">
                <p class="status__text error-message">Неверное имя пользователя или пароль</p>
            </div>
        </section>
    </main>
    <footer class="footer">
        <p class="footer__text">© 2025 Court System | by Atlas Continental</p>
    </footer>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error')) {
            document.getElementById('error').style.display = 'block';
        }
        document.querySelector('input[name="redirect"]').value = urlParams.get('redirect') || '';
    </script>
</body>
</html>
