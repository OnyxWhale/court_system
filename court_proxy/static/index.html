<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Court System</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Court System</h1>
        <div class="button-grid">
            <a href="/parser/" class="button-card">
                <h2>Парсер</h2>
                <p>Собирает данные с форумов, парсит треды и сообщения.</p>
            </a>
            <a href="/judges/" class="button-card">
                <h2>Судьи</h2>
                <p>Анализирует данные о судьях и их решениях.</p>
            </a>
            <a href="/processor/" class="button-card">
                <h2>Процессор</h2>
                <p>Обрабатывает собранные данные для анализа.</p>
            </a>
            <a href="/stats/" class="button-card">
                <h2>Статистика</h2>
                <p>Показывает статистику по тредов и сообщений.</p>
            </a>
            <a href="/admin/" class="button-card">
                <h2>Админ</h2>
                <p>Управление системой и доступ к базе данных.</p>
            </a>
        </div>
    </div>
</body>
</html>
